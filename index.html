<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/L.Control.Locate.min.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet-measure.css">
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        }

        /* =========================
           Éléments d'information
           ========================= */

        #map-title {
            position: absolute;
            top: 12px;
            left: 60px;
            z-index: 1000;
            background: rgba(255,255,255,0.96);
            padding: 10px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #222;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.30);
            max-width: calc(100% - 340px);
        }

        #map-title .subtitle {
            display: block;
            margin-top: 3px;
            font-size: 11px;
            font-weight: 400;
            color: #555;
        }

        #map-source {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.94);
            padding: 7px 10px;
            font-size: 10px;
            line-height: 1.45;
            color: #333;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        /* Flèche du nord */
        #north-arrow {
            position: absolute;
            bottom: 72px;
            right: 12px;
            z-index: 1000;
            width: 42px;
            height: 50px;
            background: rgba(255,255,255,0.94);
            border-radius: 5px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
            text-align: center;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }

        #north-arrow .n {
            font-size: 13px;
            font-weight: 700;
            line-height: 16px;
        }

        #north-arrow .arrow {
            font-size: 28px;
            line-height: 28px;
            font-weight: 700;
        }

        /* =========================
           Légende (liste des couches)
           ========================= */

        /* Le titre n'apparaît que lorsque la légende est dépliée */
        .leaflet-control-layers-expanded::before {
            content: "LÉGENDE";
            display: block;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 10px 6px;
            border-bottom: 1px solid #ddd;
            text-align: center;
            color: #222;
        }

        .leaflet-control-layers {
            border-radius: 6px !important;
            box-shadow: 0 1px 5px rgba(0,0,0,0.30) !important;
        }

        .leaflet-control-layers-list {
            max-height: 55vh;
            overflow-y: auto;
        }

        /* =========================
           Panneau de statistiques
           ========================= */

        .stats-control {
            background: rgba(255,255,255,0.96);
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.30);
            min-width: 210px;
            font-size: 12px;
            line-height: 1.4;
            color: #222;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .stats-header:focus-visible,
        .stats-row:focus-visible {
            outline: 2px solid #1a5fb4;
            outline-offset: 1px;
        }

        .stats-chevron {
            transition: transform 0.15s;
        }

        .stats-control.collapsed .stats-chevron {
            transform: rotate(-90deg);
        }

        .stats-body {
            padding: 4px 6px 8px;
            border-top: 1px solid #ddd;
        }

        .stats-control.collapsed .stats-body {
            display: none;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 4px 6px;
            margin: 0;
            border: 0;
            border-radius: 4px;
            background: transparent;
            font: inherit;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
        }

        .stats-row:hover {
            background: #f0f0f0;
        }

        .stats-row.active {
            background: #e3edfb;
            box-shadow: inset 0 0 0 1px #7aa2e8;
        }

        .stats-row.functional { color: #168a16; }
        .stats-row.broken     { color: #d62828; }
        .stats-row.unknown    { color: #666; }
        .stats-row.total      { color: #222; margin-top: 2px; border-top: 1px solid #ddd; border-radius: 0 0 4px 4px; }

        .stats-rate {
            padding: 4px 6px 0;
            color: #333;
        }

        .stats-hint {
            padding: 4px 6px 0;
            font-size: 10px;
            color: #777;
        }

        /* =========================
           Fenêtre d'information (popup)
           ========================= */

        .pt-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            padding-right: 12px;
        }

        .pt-table {
            border-collapse: collapse;
            font-size: 12px;
        }

        .pt-table th {
            text-align: left;
            color: #555;
            font-weight: 600;
            padding: 2px 12px 2px 0;
            vertical-align: top;
            white-space: nowrap;
        }

        .pt-table td {
            padding: 2px 0;
        }

        .badge {
            display: inline-block;
            padding: 1px 9px;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 11px;
        }

        .badge.F { background: #168a16; }
        .badge.P { background: #d62828; }
        .badge.N { background: #777; }

        /* =========================
           Adaptation écran mobile
           ========================= */
        @media (max-width: 650px) {
            #map-title {
                left: 50px;
                top: 8px;
                font-size: 14px;
                max-width: calc(100% - 70px);
                padding: 7px 10px;
            }

            #map-title .subtitle {
                font-size: 9px;
            }

            .stats-control {
                min-width: 170px;
                font-size: 11px;
            }

            #map-source {
                bottom: 5px;
                left: 5px;
                font-size: 9px;
                max-width: 55%;
            }

            #north-arrow {
                bottom: 80px;
                right: 8px;
                transform: scale(0.85);
                transform-origin: bottom right;
            }
        }
    </style>
    <title>Carte interactive des ouvrages d'eau potable de Dori</title>
</head>
<body>
    <div id="map-title">
        Carte interactive des ouvrages d'eau potable de Dori
        <span class="subtitle">Localisation, typologie et état des ouvrages hydrauliques</span>
    </div>

    <div id="north-arrow" title="Orientation" aria-hidden="true">
        <div class="n">N</div>
        <div class="arrow">▲</div>
    </div>

    <div id="map-source">
        <strong>Sources des données : </strong>
        INOH 2025 &amp; ONEA<br>
        Réalisation : SAWADOGO Rasmané<br>
        Date de réalisation : Septembre 2026
    </div>

    <div id="map"></div>

    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/L.Control.Locate.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet-measure.js"></script>
    <script src="data/communededori_1.js"></script>
    <script src="data/localites_2.js"></script>
    <script src="data/Typedepointdeau_3.js"></script>
    <script>
    // =====================================================
    // Utilitaires
    // =====================================================
    function esc(v) {
        return String(v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function isEmpty(v) {
        return v === null || v === undefined || String(v).trim() === '';
    }

    function debounce(fn, delay) {
        var timer;
        return function () {
            clearTimeout(timer);
            timer = setTimeout(fn, delay);
        };
    }

    // État d'un ouvrage (champ FonctInv) : F = fonctionnel, P = en panne, N = non renseigné
    var ETATS = {
        F: 'Fonctionnel',
        P: 'En panne',
        N: 'Non renseigné'
    };

    function getEtat(feature) {
        var v = feature.properties['FonctInv'];
        if (isEmpty(v)) { return 'N'; }
        v = String(v).trim().toUpperCase();
        if (v === 'F' || v === 'FONCTIONNEL') { return 'F'; }
        if (v === 'P' || v === 'PANNE' || v === 'EN PANNE') { return 'P'; }
        return 'N';
    }

    // =====================================================
    // Carte et contrôles
    // =====================================================
    var map = L.map('map', {
        zoomControl: false,
        maxZoom: 22,
        minZoom: 1
    });

    map.attributionControl.setPrefix(
        '<a href="https://github.com/qgis2web/qgis2web" target="_blank" rel="noopener">qgis2web</a> &middot; ' +
        '<a href="https://leafletjs.com" title="Bibliothèque cartographique JavaScript">Leaflet</a> &middot; ' +
        '<a href="https://qgis.org" target="_blank" rel="noopener">QGIS</a>'
    );

    L.control.zoom({ position: 'topleft' }).addTo(map);
    L.control.locate({ locateOptions: { maxZoom: 19 } }).addTo(map);

    var measureControl = new L.Control.Measure({
        position: 'topleft',
        primaryLengthUnit: 'meters',
        secondaryLengthUnit: 'kilometers',
        primaryAreaUnit: 'sqmeters',
        secondaryAreaUnit: 'hectares'
    });
    measureControl.addTo(map);
    var measureToggle = document.getElementsByClassName('leaflet-control-measure-toggle')[0];
    if (measureToggle) {
        measureToggle.innerHTML = '';
        measureToggle.className += ' fas fa-ruler';
    }

    var bounds_group = new L.featureGroup([]);

    function setBounds() {
        if (bounds_group.getLayers().length) {
            map.fitBounds(bounds_group.getBounds());
        }
        // Limite le déplacement autour de la zone d'étude sans bloquer la navigation
        map.setMaxBounds(map.getBounds().pad(0.6));
        map.setMinZoom(Math.max(map.getZoom() - 2, 1));
    }

    // =====================================================
    // Fonds de carte
    // =====================================================
    var basemap_esri = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Imagerie &copy; Esri, Maxar, Earthstar Geographics',
            maxZoom: 22,
            maxNativeZoom: 19
        });

    //var basemap_osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        //attribution: '&copy; contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" //rel="noopener">OpenStreetMap</a>',
        //maxZoom: 22,
       // maxNativeZoom: 19
    //});

    var basemap_google = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        attribution: 'Imagerie satellite Google',
        maxZoom: 22,
        maxNativeZoom: 20
    });

    map.addLayer(basemap_esri);

    // =====================================================
    // Couche : commune de Dori (limite)
    // =====================================================
    map.createPane('pane_communededori_1');
    map.getPane('pane_communededori_1').style.zIndex = 401;

    var layer_communededori_1 = new L.geoJson(json_communededori_1, {
        attribution: '',
        interactive: false,
        pane: 'pane_communededori_1',
        style: function () {
            return {
                pane: 'pane_communededori_1',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                weight: 3.0,
                fill: true,
                fillOpacity: 0,
                interactive: false
            };
        }
    });
    bounds_group.addLayer(layer_communededori_1);
    map.addLayer(layer_communededori_1);

    // =====================================================
    // Couche : localités (étiquettes)
    // =====================================================
    map.createPane('pane_localites_2');
    map.getPane('pane_localites_2').style.zIndex = 402;

    var layer_localites_2 = new L.geoJson(json_localites_2, {
        attribution: '',
        interactive: false,
        pane: 'pane_localites_2',
        pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
                pane: 'pane_localites_2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,0,0,1.0)',
                interactive: false
            });
        }
    });
    bounds_group.addLayer(layer_localites_2);
    map.addLayer(layer_localites_2);

    // =====================================================
    // Couche : ouvrages d'eau potable
    // =====================================================

    // Champs affichés dans la fenêtre d'information : [champ, intitulé]
    // Modifiez les intitulés ici pour les adapter à votre table attributaire.
    var POPUP_FIELDS = [
        ['NOM_COMMUN', 'Commune'],
        ['Nom_du_vil', 'Village / localité'],
        ['LIBELLE__1', "Type de point d'eau"],
        ['LIBELLE_TY', 'Type (LIBELLE_TY)'],
        ['LIBELLE_ST', 'Statut (LIBELLE_ST)'],
        ['LIBELLE__2', 'Détail (LIBELLE__2)'],
        ['AnExecPEM',  "Année d'exécution"],
        ['NOM_PROJET', 'Projet']
    ];

    var COULEURS_TYPE = {
        'Borne fontaine': { fill: 'rgba(51,160,44,1.0)',  stroke: 'rgba(35,35,35,1.0)' },
        'Forage':         { fill: 'rgba(255,127,0,1.0)',  stroke: 'rgba(0,0,0,1.0)' }
    };
    var COULEUR_AUTRE = { fill: 'rgba(120,120,120,1.0)', stroke: 'rgba(35,35,35,1.0)' };

    function style_Typedepointdeau_3_0(feature) {
        var c = COULEURS_TYPE[String(feature.properties['LIBELLE__1'])] || COULEUR_AUTRE;
        return {
            pane: 'pane_Typedepointdeau_3',
            radius: 4.0,
            opacity: 1,
            color: c.stroke,
            weight: 1,
            fill: true,
            fillOpacity: 1,
            fillColor: c.fill,
            interactive: true
        };
    }

    function buildPopup(feature) {
        var p = feature.properties;
        var etat = getEtat(feature);
        var titre = !isEmpty(p['Nom_du_vil']) ? p['Nom_du_vil'] : (!isEmpty(p['LIBELLE__1']) ? p['LIBELLE__1'] : 'Point d\'eau');

        var rows = '<tr><th scope="row">État</th><td><span class="badge ' + etat + '">' + ETATS[etat] + '</span></td></tr>';
        POPUP_FIELDS.forEach(function (f) {
            if (!isEmpty(p[f[0]])) {
                rows += '<tr><th scope="row">' + esc(f[1]) + '</th><td>' + esc(p[f[0]]) + '</td></tr>';
            }
        });

        return '<div class="pt-title">' + esc(titre) + '</div><table class="pt-table">' + rows + '</table>';
    }

    var HIGHLIGHT_STYLE = { fillColor: 'rgba(255,255,0,1.0)', radius: 6, weight: 2 };

    function pop_Typedepointdeau_3(feature, layer) {
        layer.on({
            mouseover: function (e) { e.target.setStyle(HIGHLIGHT_STYLE); },
            mouseout:  function (e) { e.target.setStyle(style_Typedepointdeau_3_0(feature)); }
        });
        layer.bindPopup(buildPopup(feature), { maxHeight: 320, maxWidth: 300 });
    }

    var filtreEtat = 'ALL';   // ALL, F, P ou N

    map.createPane('pane_Typedepointdeau_3');
    map.getPane('pane_Typedepointdeau_3').style.zIndex = 403;

    var layer_Typedepointdeau_3 = new L.geoJson(json_Typedepointdeau_3, {
        attribution: '',
        interactive: true,
        pane: 'pane_Typedepointdeau_3',
        filter: function (feature) {
            return filtreEtat === 'ALL' || getEtat(feature) === filtreEtat;
        },
        onEachFeature: pop_Typedepointdeau_3,
        pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, style_Typedepointdeau_3_0(feature));
        }
    });
    bounds_group.addLayer(layer_Typedepointdeau_3);
    map.addLayer(layer_Typedepointdeau_3);

    // =====================================================
    // Statistiques (champ FonctInv)
    // =====================================================
    var counts = { F: 0, P: 0, N: 0, total: 0 };
    if (typeof json_Typedepointdeau_3 !== 'undefined' && json_Typedepointdeau_3.features) {
        json_Typedepointdeau_3.features.forEach(function (feature) {
            counts[getEtat(feature)]++;
            counts.total++;
        });
    }

    var renseignes = counts.F + counts.P;
    var tauxFonct = renseignes > 0 ? Math.round(counts.F / renseignes * 100) : null;

    function fmt(n) { return n.toLocaleString('fr-FR'); }

    // =====================================================
    // Légende (arbre des couches)
    // =====================================================
    var baseTree = [
        { label: 'Satellite (Esri)', layer: basemap_esri },
        //{ label: 'OpenStreetMap', layer: basemap_osm },
        { label: 'Satellite (Google)', layer: basemap_google }
    ];

    var overlaysTree = [
        { label: 'Type de point d\'eau<br /><table><tr><td style="text-align: center;"><img src="legend/Typedepointdeau_3_Bornefontaine0.png" alt="" /></td><td>Borne fontaine</td></tr><tr><td style="text-align: center;"><img src="legend/Typedepointdeau_3_Forage1.png" alt="" /></td><td>Forage</td></tr></table>', layer: layer_Typedepointdeau_3 },
        { label: '<img src="legend/localites_2.png" alt="" /> Localités', layer: layer_localites_2 },
        { label: '<img src="legend/communededori_1.png" alt="" /> Commune de Dori', layer: layer_communededori_1 }
    ];

    var isSmallScreen = window.innerWidth < 650;

    L.control.layers.tree(baseTree, overlaysTree, {
        collapsed: isSmallScreen
    }).addTo(map);

    // =====================================================
    // Panneau de statistiques (placé sous la légende, sans chevauchement)
    // =====================================================
    var StatsControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function () {
            var div = L.DomUtil.create('div', 'stats-control');
            div.innerHTML =
                '<div class="stats-header" role="button" tabindex="0" aria-label="Afficher ou masquer les statistiques">' +
                    '<span>ÉTAT DES OUVRAGES</span><span class="stats-chevron">▾</span>' +
                '</div>' +
                '<div class="stats-body">' +
                    '<button type="button" class="stats-row functional" data-filter="F"><span>🟢 Fonctionnels</span><span>' + fmt(counts.F) + '</span></button>' +
                    '<button type="button" class="stats-row broken" data-filter="P"><span>🔴 En panne</span><span>' + fmt(counts.P) + '</span></button>' +
                    '<button type="button" class="stats-row unknown" data-filter="N"><span>⚪ Non renseignés</span><span>' + fmt(counts.N) + '</span></button>' +
                    '<button type="button" class="stats-row total" data-filter="ALL"><span>Total</span><span>' + fmt(counts.total) + '</span></button>' +
                    (tauxFonct !== null ? '<div class="stats-rate">Taux de fonctionnement : <strong>' + tauxFonct + ' %</strong> <span style="color:#777">(sur les ouvrages renseignés)</span></div>' : '') +
                    '<div class="stats-hint">Cliquer sur une ligne pour filtrer la carte.</div>' +
                '</div>';

            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            var header = div.querySelector('.stats-header');
            function toggle() { L.DomUtil.hasClass(div, 'collapsed') ? L.DomUtil.removeClass(div, 'collapsed') : L.DomUtil.addClass(div, 'collapsed'); }
            header.addEventListener('click', toggle);
            header.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
            });

            if (isSmallScreen) { L.DomUtil.addClass(div, 'collapsed'); }

            var rows = div.querySelectorAll('.stats-row');
            Array.prototype.forEach.call(rows, function (row) {
                row.addEventListener('click', function () {
                    var f = row.getAttribute('data-filter');
                    // Un second clic sur le même filtre (ou sur « Total ») réaffiche tout
                    filtreEtat = (f === 'ALL' || f === filtreEtat) ? 'ALL' : f;

                    Array.prototype.forEach.call(rows, function (r) {
                        var actif = r.getAttribute('data-filter') === filtreEtat && filtreEtat !== 'ALL';
                        r.classList.toggle('active', actif);
                    });

                    layer_Typedepointdeau_3.clearLayers();
                    layer_Typedepointdeau_3.addData(json_Typedepointdeau_3);
                });
            });

            return div;
        }
    });
    new StatsControl().addTo(map);

    // =====================================================
    // Étiquettes des localités
    // =====================================================
    var i = 0;
    layer_localites_2.eachLayer(function (layer) {
        var nom = layer.feature.properties['NOM'];
        layer.bindTooltip(
            !isEmpty(nom)
                ? '<div style="color: #323232; font-size: 8pt; font-family: \'Segoe UI Variable Small\', \'Segoe UI\', sans-serif;">' + esc(nom) + '</div>'
                : '',
            { permanent: true, offset: [0, -16], className: 'css_localites_2' }
        );
        labels.push(layer);
        totalMarkers += 1;
        layer.added = true;
        addLabel(layer, i);
        i++;
    });

    resetLabels([layer_localites_2]);

    // Recalcul groupé des étiquettes (évite des dizaines d'appels lors d'un filtrage)
    var relayoutLabels = debounce(function () {
        resetLabels([layer_localites_2]);
    }, 80);

    map.on('zoomend layeradd layerremove', relayoutLabels);

    // =====================================================
    // Échelle et cadrage initial
    // =====================================================
    L.control.scale({
        position: 'bottomright',
        imperial: false,
        metric: true,
        maxWidth: 120
    }).addTo(map);

    setBounds();
    </script>
</body>
</html>
